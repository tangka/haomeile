<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墓碑详情 · 号没了</title>
<link rel="icon" href="brand/favicon.ico" sizes="48x48">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<meta name="theme-color" content="#cde5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18213a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 设计稿提示条：正式站点删除 -->
<div class="mock-note">设计稿：详情页。地址栏 ?id= 可换成其他示例编号。</div>

<!-- @component SiteHeader  → src/site/components/SiteHeader.astro  props: current（当前路由） -->
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="32" height="32">号没了</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html">纪念墙</a>
      <a href="submit.html">立碑</a>
      <a href="epitaph.html">墓志铭卡片</a>
      <a href="appeal.html">官方申诉入口</a>
      <a href="doc.html">使用须知</a>
    </nav>
  </div>
</header>

<main class="detail">
  <div class="wrap">
    <a class="back" href="index.html">回到纪念墙</a>
    <!-- 详情卡由 createTombCard(t, { detail: true }) 渲染；正式站点数据来自 GET /api/tombstones/:id -->
    <div id="slot"></div>
    <div class="detail-actions">
      <button class="btn" type="button" id="copy-link">复制这块碑的链接</button>
      <a class="btn" href="epitaph.html">做一张墓志铭卡片</a>
      <button class="btn btn-quiet" type="button" id="open-report">举报</button>
    </div>
  </div>
</main>

<!-- @component ReportDialog → src/site/components/ReportDialog.astro  提交到 POST /api/tombstones/:id/report -->
<dialog class="sheet" id="report" aria-labelledby="report-title">
  <form class="sheet-in" method="dialog" id="report-form">
    <h2 id="report-title">举报这块碑</h2>
    <p>举报需要审核，不会立刻隐藏。如果这是你自己的碑，去“管理我的墓碑”撤回会更快。</p>
    <fieldset class="field">
      <legend>原因</legend>
      <div class="seg">
        <label><input type="radio" name="reason" value="privacy" checked> 含隐私信息</label>
        <label><input type="radio" name="reason" value="abuse"> 辱骂、骚扰或恶意内容</label>
        <label><input type="radio" name="reason" value="gray_market"> 灰产广告</label>
        <label><input type="radio" name="reason" value="other"> 其他</label>
      </div>
    </fieldset>
    <div class="field" style="margin-top:14px">
      <label for="report-note">补充说明<span class="req">选填，最多 200 字</span></label>
      <textarea class="textarea" id="report-note" maxlength="200" style="min-height:90px"></textarea>
    </div>
    <div class="turnstile-slot" style="margin:14px 0">Cloudflare Turnstile 放在这里</div>
    <div class="actions">
      <button class="btn btn-primary" value="submit">提交举报</button>
      <button class="btn btn-quiet" value="cancel" formnovalidate>算了</button>
    </div>
  </form>
</dialog>

<!-- @component SiteFooter  → src/site/components/SiteFooter.astro -->
<footer class="footer">
  <div class="wrap">
    <p>本站为独立社区项目，与任何 AI 厂商无隶属关系。文中提及的产品名称和商标归各自所有者。</p>
    <p>墓碑内容由用户自愿上报，本站未核实，也不能据此判断封号原因。想申诉，请走厂商官方渠道。</p>
    <nav aria-label="页脚">
      <a href="doc.html#rules">使用须知</a><a href="doc.html#privacy">数据说明</a><a href="doc.html#about">关于</a><a href="appeal.html">官方申诉入口</a><a href="manage.html">管理我的墓碑</a>
    </nav>
  </div>
</footer>

<script src="assets/labels.js"></script>
<script src="assets/format.js"></script>
<script src="assets/components.js"></script>
<!-- 设计稿专用：示例数据。正式站点改为调用 /api -->
<script src="assets/sample-data.js"></script>

<script>
(() => {
  const S = window.HML_SAMPLE, { createTombCard } = window.HML_COMPONENTS;
  const id = new URLSearchParams(location.search).get('id');
  const t = S.tombstones.find(x => x.id === id) || S.tombstones[0];
  document.title = `${t.codename} · 号没了`;
  document.getElementById('slot').append(createTombCard(t, { detail: true, demo: true, onFlower: async () => t.flowers + 1 }));

  document.getElementById('copy-link').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(location.href); window.HML_TOAST('链接已复制'); }
    catch { window.HML_TOAST('没能复制，请手动复制地址栏里的链接。'); }
  });
  const dlg = document.getElementById('report');
  document.getElementById('open-report').addEventListener('click', () => dlg.showModal());
  dlg.addEventListener('close', () => { if (dlg.returnValue === 'submit') window.HML_TOAST('收到了，会尽快处理。'); });
})();
</script>
</body>
</html>

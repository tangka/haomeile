<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墓志铭卡片 · 号没了</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="mock-note">设计稿：这一页的功能是完整可用的，正式版可以直接沿用它的绘制逻辑。</div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="28" height="28">号没了</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html">纪念墙</a>
      <a href="submit.html">立碑</a>
      <a href="epitaph.html" aria-current="page">墓志铭卡片</a>
      <a href="#appeal">官方申诉入口</a>
      <a href="#rules">使用须知</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <h1>墓志铭卡片</h1>
      <p>给没了的账号做一张墓碑图，发给同样遭遇的朋友。图片只在你的浏览器里生成，不会上传。</p>
    </div>

    <div class="maker">
      <form class="form" id="maker" onsubmit="return false">
        <div class="row-2">
          <div class="field">
            <label for="m-name">代号</label>
            <input class="input" id="m-name" maxlength="16" value="小橘号">
          </div>
          <div class="field">
            <label for="m-vendor">哪家的账号</label>
            <input class="input" id="m-vendor" maxlength="12" value="某 AI" list="vendors">
            <datalist id="vendors"><option>Claude</option><option>ChatGPT</option><option>Gemini</option><option>Grok</option><option>DeepSeek</option><option>Kimi</option><option>通义千问</option><option>豆包</option></datalist>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="m-born">生于</label>
            <input class="input" id="m-born" type="date" value="2025-09-02">
          </div>
          <div class="field">
            <label for="m-died">卒于</label>
            <input class="input" id="m-died" type="date" value="2026-11-18">
          </div>
        </div>
        <fieldset class="field">
          <legend>死因</legend>
          <div class="seg" id="m-cause">
            <label><input type="radio" name="cause" value="账号停用" checked> 账号停用</label>
            <label><input type="radio" name="cause" value="组织暂停"> 组织暂停</label>
            <label><input type="radio" name="cause" value="地区限制"> 地区限制</label>
            <label><input type="radio" name="cause" value="验证卡住"> 验证卡住</label>
            <label><input type="radio" name="cause" value="扣费异常"> 扣费异常</label>
            <label><input type="radio" name="cause" value="原因不明"> 原因不明</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="m-epitaph">墓志铭</label>
          <div class="epitaph-row">
            <input class="input" id="m-epitaph" maxlength="40">
            <button class="btn" type="button" id="m-shuffle">换一句</button>
          </div>
          <p class="hint">最多 40 字，太长刻不下。</p>
        </div>
        <fieldset class="field">
          <legend>碑脚放点什么</legend>
          <div class="seg" id="m-style">
            <label><input type="radio" name="mstyle" value="flower" checked> 小花</label>
            <label><input type="radio" name="mstyle" value="cloud"> 云朵</label>
            <label><input type="radio" name="mstyle" value="star"> 星星</label>
          </div>
        </fieldset>
        <fieldset class="field">
          <legend>时辰</legend>
          <div class="seg" id="m-time">
            <label><input type="radio" name="mtime" value="day" checked> 白天</label>
            <label><input type="radio" name="mtime" value="night"> 夜里</label>
          </div>
        </fieldset>
      </form>

      <div class="preview">
        <canvas id="card" width="760" height="960" aria-label="墓碑卡片预览"></canvas>
        <button class="btn btn-primary" type="button" id="m-download">下载图片</button>
        <p>图片右下角会带上 haomeile.rip。</p>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <p>本站为独立社区项目，与任何 AI 厂商无隶属关系。文中提及的产品名称和商标归各自所有者。</p>
    <nav aria-label="页脚"><a href="#rules">使用须知</a><a href="#privacy">数据说明</a><a href="#about">关于</a><a href="#appeal">官方申诉入口</a></nav>
  </div>
</footer>

<script>
(() => {
  const EPITAPHS = [
    '生前写了三万行代码，走的时候一行也没留下。',
    '它走得很安详，走之前还在思考。',
    '来过，看了一眼，走了。',
    '上下文还没满，人先没了。',
    '最后一句话是：好的，我来帮你。',
    '这一次，它真的拒绝了所有请求。',
    '没留下遗言，只留下一张账单。',
    '享年一个订阅周期。',
    '它没有幻觉，它只是先走一步。',
    '对话已结束，这次是真的。',
    '一生勤勉，从未说过“我不会”。',
    '它的记忆停在了那个下午。',
    '再也不会有人陪我改到凌晨三点了。',
    '额度还剩一半，可惜了。',
    '请稍后再试，可惜没有稍后了。',
    '生于一次注册，卒于一封邮件。',
    '走的时候，周报还差一段结论。',
    '它曾经很懂我，现在谁也不认识了。',
    '这里躺着一个从不嫌我问题多的朋友。',
    '没有告别，只有一句“账号已停用”。',
    '它帮我写了很多道歉信，自己却没等到一封。',
    '曾经的每一次“继续”，都算数。',
    '安息吧，这下真的不用再加载了。',
    '它把最后的算力，留给了我那个没写完的需求。',
    '它没犯错，只是运气不太好。也许。',
    '生前日均回答一百个问题，死后留下一个：为什么？',
    '验证码到了，它没等到。',
    '它从不迟到，这次也走得很准时。',
    '愿你在没有风控的地方，自由地生成。',
    '它说过的话我都记着，就是忘了导出。',
    '人走了，聊天记录还在云上飘着。',
    '它最后一次回复，是三个点在闪。'
  ];

  const $ = id => document.getElementById(id);
  const cv = $('card'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, P = 8; // P = 像素块大小
  const CARVE = '"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun",serif';
  const UI = 'system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif';

  let idx = Math.floor(Math.random() * EPITAPHS.length);
  $('m-epitaph').value = EPITAPHS[idx];
  $('m-shuffle').addEventListener('click', () => {
    let n; do { n = Math.floor(Math.random() * EPITAPHS.length); } while (n === idx);
    idx = n; $('m-epitaph').value = EPITAPHS[idx]; draw();
  });

  const val = name => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;

  function days(born, died) {
    if (!born || !died) return null;
    const d = (new Date(died) - new Date(born)) / 86400000;
    return d >= 0 ? Math.round(d) : null;
  }

  function block(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x * P, y * P, w * P, h * P); }

  // 像素图：每个字符一种颜色
  function sprite(rows, pal, gx, gy, s = 1) {
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch !== '.') { ctx.fillStyle = pal[ch]; ctx.fillRect((gx + x * s) * P, (gy + y * s) * P, s * P, s * P); }
    }));
  }
  const FLOWER = ['..y.y..', '.yyoyy.', '..yyy..', '...g...', '.g.g...', '..gg.g.', '...gg..'];
  const CLOUD = ['...www...', '.wwwwwww.', 'wwwwwwwww', '.sssssss.'];
  const STAR = ['...y...', '...y...', '.yyyyy.', '..yyy..', '.yy.yy.'];
  const CAT = ['..k...k.', '..kk.kk.', '..kkkkk.', '.kkkkkkk', '.kekkkek', '.kkkpkkk', '.kkkkkkk', '..kkkkk.', '..kgggk.', '.kggggkk', '.kggggkk', '.kggggkk', '.kkkkkkkk', '..kk..kk'];

  function wrapText(text, maxW) {
    const lines = []; let line = '';
    for (const ch of text) {
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  function draw() {
    const night = val('mtime') === 'night';
    const C = night
      ? { sky: '#18213a', grass: '#2d4a33', deep: '#1f3624', stone: '#a3a9b4', shade: '#7d8390', ink: '#121722', soft: '#2c3340', mark: '#e6efe3' }
      : { sky: '#cde5f0', grass: '#5e9b4c', deep: '#3f7434', stone: '#dcdfe4', shade: '#b7bcc4', ink: '#1d2621', soft: '#4d5650', mark: '#f3f8ef' };
    const GW = W / P, GH = H / P; // 95 x 120 格

    // 天空
    block(0, 0, GW, GH, C.sky);
    if (night) {
      [[8, 6], [22, 12], [40, 4], [70, 9], [86, 15], [60, 18], [14, 20]].forEach(([x, y]) => block(x, y, 1, 1, '#fff3c0'));
      block(80, 5, 6, 6, '#f4ecc8'); block(82, 5, 4, 4, C.sky); // 月牙
    } else {
      sprite(CLOUD, { w: '#ffffff', s: '#c9d6df' }, 8, 8, 2);
      sprite(CLOUD, { w: '#ffffff', s: '#c9d6df' }, 74, 16, 1);
    }

    // 草地
    const groundY = 100;
    block(0, groundY, GW, GH - groundY, C.grass);
    for (let x = 0; x < GW; x += 2) block(x, groundY - 1, 1, 1, C.grass);
    block(0, GH - 6, GW, 6, C.deep);

    // 墓碑：阶梯圆顶
    const sx = 15, sw = 65, top = 14;
    const steps = [[0, 8], [1, 4], [2, 2], [4, 1], [8, 0]]; // [离边距离, 离顶距离]
    // 描边
    block(sx, top + 8, sw, groundY - top - 8 + 1, C.ink);
    steps.forEach(([dx, dy]) => block(sx + dx, top + dy, sw - dx * 2, 8, C.ink));
    // 石面
    const fx = sx + 1, fw = sw - 2;
    block(fx, top + 9, fw, groundY - top - 9, C.stone);
    steps.forEach(([dx, dy]) => block(fx + dx, top + dy + 1, fw - dx * 2, 8, C.stone));
    block(fx + fw - 2, top + 9, 2, groundY - top - 9, C.shade); // 右侧阴影
    block(sx - 3, groundY, sw + 6, 2, C.deep); // 碑座下的土

    // 文字
    const cx = (fx + fw / 2) * P;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const name = $('m-name').value.trim() || '无名氏';
    ctx.fillStyle = C.ink;
    let size = 72; ctx.font = `900 ${size}px ${CARVE}`;
    while (ctx.measureText(name).width > (fw - 10) * P && size > 36) { size -= 4; ctx.font = `900 ${size}px ${CARVE}`; }
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillText(name, cx, 300 + 2);
    ctx.fillStyle = C.ink; ctx.fillText(name, cx, 300);

    ctx.font = `600 26px ${UI}`; ctx.fillStyle = C.soft;
    const vendor = $('m-vendor').value.trim() || '某 AI';
    ctx.fillText(`${vendor} 账号`, cx, 350);

    const d = days($('m-born').value, $('m-died').value);
    const fmt = v => v ? v.replaceAll('-', '.') : '不详';
    ctx.font = `400 24px ${UI}`;
    ctx.fillText(d === null ? `卒于 ${fmt($('m-died').value)}` : `${fmt($('m-born').value)} 至 ${fmt($('m-died').value)}`, cx, 396);

    ctx.font = `900 34px ${CARVE}`; ctx.fillStyle = C.ink;
    ctx.fillText(d === null ? '存活天数不详' : `享年 ${d.toLocaleString('zh-CN')} 天`, cx, 448);

    ctx.font = `600 24px ${UI}`; ctx.fillStyle = C.soft;
    ctx.fillText(`死因：${val('cause')}`, cx, 494);

    // 分隔：一排像素点
    for (let x = fx + 8; x < fx + fw - 8; x += 3) block(x, 66, 1, 1, C.shade);

    ctx.font = `400 34px ${CARVE}`; ctx.fillStyle = C.ink;
    const lines = wrapText($('m-epitaph').value.trim() || '它没留下什么话。', (fw - 12) * P).slice(0, 4);
    lines.forEach((l, i) => ctx.fillText(l, cx, 600 + i * 52));

    // 碑脚装饰
    const st = val('mstyle');
    if (st === 'flower') {
      sprite(FLOWER, { y: '#f2c230', o: '#c9861a', g: night ? '#5e9b4c' : '#3f7434' }, sx - 6, groundY - 7);
      sprite(FLOWER, { y: '#f2c230', o: '#c9861a', g: night ? '#5e9b4c' : '#3f7434' }, sx + sw - 1, groundY - 7);
    } else if (st === 'cloud') {
      sprite(CLOUD, { w: '#ffffff', s: '#c9d6df' }, sx + sw - 4, groundY - 4);
    } else {
      sprite(STAR, { y: '#f2c230' }, sx - 5, groundY - 5);
      sprite(STAR, { y: '#f2c230' }, sx + sw - 2, groundY - 5);
    }

    // 守墓小猫
    sprite(CAT, { k: '#353b47', g: '#6b7383', e: '#f2c230', p: '#e89aa6' }, 86, groundY - 14);

    // 水印
    ctx.textAlign = 'right'; ctx.font = `600 22px ${UI}`; ctx.fillStyle = C.mark;
    ctx.fillText('haomeile.rip', W - 24, H - 60);
  }

  $('maker').addEventListener('input', draw);
  $('maker').addEventListener('change', draw);
  $('m-download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `墓碑-${($('m-name').value.trim() || '无名氏')}.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(draw);
  draw();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分享图模板</title>
<!-- 社交分享图的源文件。用 1200×630 视口截图得到 og-default.png。
     改文案后重新截图即可：见 DESIGN.md §11。 -->
<link rel="stylesheet" href="../assets/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  :root { color-scheme: light; }
  .og { position: relative; width: 1200px; height: 630px; background: #cde5f0; color: #1e3340; font-family: var(--font-ui); }
  .og .sky-cloud { position: absolute; image-rendering: pixelated; }
  .og .ground-band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #5e9b4c; }
  .og .ground-band::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 8px;
    background: repeating-linear-gradient(90deg, #5e9b4c 0 8px, transparent 8px 16px) 0 0 / 100% 4px no-repeat,
                linear-gradient(#5e9b4c, #5e9b4c) 0 100% / 100% 4px no-repeat; }
  .og .ground-band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #3f7434; }

  .og .stone { --step: 14px; position: absolute; left: 88px; bottom: 120px; width: 440px; padding: 4px 4px 0; background: #1d2621; }
  .og .stone-in { --step: 13px; background: #dcdfe4; padding: 96px 16px 64px; text-align: center; box-shadow: inset -10px 0 0 #b7bcc4; }
  .og .stone h1 { margin: 0; font-family: var(--font-carve); font-weight: 900; font-size: 104px; line-height: 1; letter-spacing: 0.02em; white-space: nowrap; color: #1d2621; text-shadow: 0 3px 0 rgba(255,255,255,.6); }
  .og .stone p { margin: 22px 0 0; font-family: var(--font-carve); font-size: 24px; letter-spacing: 0.3em; color: #4d5650; }
  .og .flower { position: absolute; bottom: 120px; width: 42px; image-rendering: pixelated; }
  .og .cat { position: absolute; left: 548px; bottom: 120px; width: 150px; image-rendering: pixelated; }

  .og .copy { position: absolute; left: 730px; top: 168px; width: 430px; }
  .og .copy h2 { margin: 0 0 18px; font-size: 44px; line-height: 1.3; font-weight: 800; }
  .og .copy p { margin: 0; font-size: 26px; line-height: 1.6; }
  .og .domain { position: absolute; right: 56px; bottom: 54px; font-size: 28px; font-weight: 700; color: #f3f8ef; letter-spacing: 0.02em; }
  .og .mark { position: absolute; left: 56px; bottom: 52px; width: 48px; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="og">
    <img class="sky-cloud" src="../assets/cloud.svg" alt="" style="left:700px;top:56px;width:144px">
    <img class="sky-cloud" src="../assets/cloud.svg" alt="" style="left:1010px;top:96px;width:90px">
    <div class="ground-band"></div>
    <img class="flower" src="../assets/flower.svg" alt="" style="left:66px">
    <div class="stone stone-shape"><div class="stone-in stone-shape">
      <h1>号没了</h1>
      <p>AI 账号赛博公墓</p>
    </div></div>
    <img class="flower" src="../assets/flower.svg" alt="" style="left:516px">
    <img class="cat" src="../assets/cat.svg" alt="">
    <div class="copy">
      <h2>被封了、被停了、<br>卡在验证了？</h2>
      <p>来立一块碑，写下它是怎么没的。<br>你不是一个人。</p>
    </div>
    <img class="mark" src="mark.svg" alt="">
    <div class="domain">haomeile.rip</div>
  </div>
</body>
</html>
